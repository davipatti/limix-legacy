[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "cython>=0.29,<3",
    "numpy>=1.19",
]
build-backend = "setuptools.build_meta"

[project]
name = "limix-legacy"
version = "0.8.14"
description = "A flexible and fast mixed model toolbox."
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Danilo Horta"},
    {name = "Christoph Lippert"},
    {name = "Paolo Casale"},
    {name = "Oliver Stegle", email = "stegle@ebi.ac.uk"},
]
maintainers = [
    {name = "Limix Developers", email = "stegle@ebi.ac.uk"},
]
keywords = ["linear mixed models", "GWAS", "QTL", "Variance component modelling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = [
    "scikit-learn",
    "pandas",
    "scipy",
    "h5py",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/limix/limix-legacy"
Repository = "https://github.com/limix/limix-legacy"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["limix_legacy*"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore=limix_legacy/modules/dirIndirVD_commented_forDistrib.py --ignore=limix_legacy/deprecated/modules/dirIndirVD_commented_forDistrib.py --ignore=limix_legacy/modules/social_data_HSmice_paper.py --ignore=limix_legacy/deprecated/io/genotype_reader.py --ignore=limix_legacy/deprecated/io/output_writer.py --ignore=limix_legacy/deprecated/io/phenotype_reader.py --ignore=limix_legacy/io/genotype_reader.py --ignore=limix_legacy/io/output_writer.py --ignore=limix_legacy/io/phenotype_reader.py"
python_files = "limix_legacy/*/*.py"
norecursedirs = "build cython demos deploy derivations External src travis .eggs"
python_functions = "test_*"
